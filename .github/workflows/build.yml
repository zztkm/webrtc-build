# テスト用ワークフロー
#
# android_proxy.patch の修正 (OwnedFactoryAndThreads の ConnectionContext の破棄順) を
# 検証するための一時的なワークフロー。android_sdk ターゲットだけをビルドしてリリースする。
# 他のプラットフォームのビルドやリリースは行わない。
# 検証が完了したら、この変更は破棄して通常の build.yml に戻すこと。
name: build
on:
  push:
    tags:
      - "*"
permissions:
  contents: write
jobs:
  build-android_sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Disk Cleanup
        run: |
          set -x
          df -h
          sudo du -h -d1 /usr/local
          sudo du -h -d1 /usr/local/share
          sudo du -h -d1 /usr/local/lib
          sudo du -h -d1 /usr/share
          RMI=`docker images -q -a`
          if [ -n "$RMI" ]; then
            docker rmi $RMI
          fi
          # 4.6G
          sudo rm -rf /usr/local/.ghcup
          # 1.7G
          sudo rm -rf /usr/share/swift
          # 1.4G
          sudo rm -rf /usr/share/dotnet
          # 13G
          sudo rm -rf /usr/local/lib/android
          df -h
      - name: Get stats
        run: |
          set -x
          cat /etc/lsb-release
          uname -a
          cat /proc/cpuinfo
          cat /proc/meminfo
      - name: Setup android_sdk
        run: sudo scripts/apt_install_x86_64.sh && sudo apt-get install -y openjdk-11-jdk
      - name: Setup Git User
        run: |
          git config --global user.name  "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
      - name: Build android_sdk
        run: |
          python3 run.py build android_sdk --no-history
          python3 run.py package android_sdk
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: webrtc.android_sdk.tar.gz
          path: _package/android_sdk/webrtc.android_sdk.tar.gz
  create-release:
    name: Create Release
    # m で始まるタグを push したときだけリリースする
    if: contains(github.ref, 'tags/m')
    needs:
      - build-android_sdk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/download
        with:
          platform: android_sdk
      - name: Env to output
        run: |
          echo "package_paths<<EOF" >> $GITHUB_OUTPUT
          cat package_paths.env >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        id: env
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.env.outputs.package_paths }}
