name: build
on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"
      - ".gitignore"
      - "scripts/version_update.sh"
    branches-ignore:
      - daily
    tags:
      - "*"
jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Disk Cleanup
        run: |
          set -x
          df -h
          sudo du -h -d1 /usr/local
          sudo du -h -d1 /usr/local/share
          sudo du -h -d1 /usr/local/lib
          sudo du -h -d1 /usr/share
          RMI=`docker images -q -a`
          if [ -n "$RMI" ]; then
            docker rmi $RMI
          fi
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          df -h
      - name: Get stats
        run: |
          set -x
          cat /etc/lsb-release
          uname -a
          cat /proc/cpuinfo
          cat /proc/meminfo
      - name: Setup android
        run: sudo scripts/apt_install_x86_64.sh && sudo apt-get install -y openjdk-11-jdk
      - name: Setup Git User
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
      - name: Build android
        run: |
          python3 run.py build android --no-history
          python3 run.py package android
      - name: Verify JNI Zero classes
        run: |
          set -eu
          jar_path=_package/android/webrtc/jar/webrtc.jar
          for class_file in \
            'org/jni_zero/JniZero.class' \
            'org/jni_zero/JniZero$Natives.class' \
            'org/jni_zero/JniZeroJni.class' \
            'org/jni_zero/GEN_JNI.class' \
            'J/N.class'
          do
            unzip -Z1 "$jar_path" | grep -Fx "$class_file"
          done
          javap -classpath "$jar_path" org.jni_zero.GEN_JNI | grep -F 'org_jni_1zero_JniZero_setJniClassLoader'
          javap -classpath "$jar_path" -c org.jni_zero.GEN_JNI | grep -F 'J/N'
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: webrtc.android.tar.gz
          path: _package/android/webrtc.android.tar.gz
